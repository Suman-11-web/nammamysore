name: mysuru-after-hours-lite

services:
  game:
    image: node:22-alpine
    init: true
    working_dir: /app
    volumes:
      - .:/app:ro
      - game-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5174:5173"

volumes:
  game-node-modules:
